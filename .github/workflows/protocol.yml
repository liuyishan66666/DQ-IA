name: Validate real-crypto protocol

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'experiments/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --only-binary=:all: -r experiments/protocol/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m experiments.protocol.run --output experiments/protocol/results_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-python-${{ matrix.python }}
          path: experiments/protocol/results_ci/
